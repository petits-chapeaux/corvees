services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: corvees
      POSTGRES_USER: corvees
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvees -d corvees"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
